apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/helm-charts
    targetRevision: main
    path: myapp
    helm:
      valueFiles:
        - values-uat.yaml
      parameters:
        - name: image.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

# AWS 对应: EKS 集群上部署 ArgoCD Application，完全相同
# 仅 destination.server 指向 AKS 集群 API Server