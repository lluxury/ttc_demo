# 默认值
replicaCount: 1

image:
  repository: acrmyapp.azurecr.io/myapp  # AWS 对应: {account}.dkr.ecr.{region}.amazonaws.com/myapp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: myapp-uat.example.com
      paths:
        - path: /
          pathType: Prefix